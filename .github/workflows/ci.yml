name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Nothing here writes back to the repo, and pull_request runs execute the PR's own
# code, so grant read-only access and keep the token out of the checkout.
permissions:
  contents: read

jobs:
  check:
    name: Typecheck, Build & Test
    runs-on: ubuntu-latest

    services:
      stripe-mock:
        # Stripe's official mock (v0.206.0), pinned by digest. The billing package's
        # stripe-mock suite checks its request shapes against Stripe's OpenAPI spec.
        image: stripe/stripe-mock@sha256:aeb96b83e87a893d2ac005e363ac01ffa6e59a5ad85b49c155dfc9129de02e78
        ports:
          - 12111:12111

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Build first: auth-ui's typecheck resolves @context-kit/auth types from packages/auth/dist.
      # The root build script builds auth before auth-ui for the same reason; `bun --filter`
      # runs packages in parallel on Bun 1.3.x and auth-ui's DTS build races auth's.
      - name: Build
        run: bun run build

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test
        env:
          STRIPE_MOCK_URL: http://localhost:12111
          # Fail (rather than skip) the billing stripe-mock suite if the service is
          # ever missing, so the request-shape checks cannot pass vacuously.
          REQUIRE_STRIPE_MOCK: "1"

  test-postgres:
    name: Package tests (Postgres)
    runs-on: ubuntu-latest

    services:
      postgres:
        # postgres:17 (17.x), pinned by index digest so the container is reproducible from the diff.
        image: postgres:17@sha256:67f41722b7a8cbdb868a44a4995c846eddfdc2973bccb291ce937dce88ad5675
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test auth against Postgres
        run: bun --filter @context-kit/auth test
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
          # Fail (rather than skip) the Postgres round-trip if DATABASE_URL is ever
          # missing here, so this job cannot pass vacuously.
          REQUIRE_POSTGRES: "1"

      - name: Test error-tracker against Postgres
        run: bun --filter @context-kit/error-tracker test
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
          # Same reason as above: a missing DATABASE_URL must fail the job, not
          # skip the Postgres round-trip.
          REQUIRE_POSTGRES: "1"

      - name: Test billing against Postgres
        run: bun --filter @context-kit/billing test
        env:
          # Dedicated name: the suite drops the billing tables, so it never reads DATABASE_URL.
          BILLING_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
          # Explicit opt-in to the destructive drop; this database is disposable.
          BILLING_TEST_ALLOW_DROP: "1"
          # Same reason as above: the concurrency checks need a real server.
          REQUIRE_POSTGRES: "1"

  billing-live:
    name: Billing against Stripe sandbox
    runs-on: ubuntu-latest
    # Skipped (grey, not green) until the repository variable STRIPE_LIVE_ENABLED
    # is set to "true" alongside the STRIPE_TEST_SECRET_KEY secret. Job-level `if`
    # cannot read secrets, hence the variable. Once enabled, REQUIRE_STRIPE_LIVE
    # makes a missing or invalid key fail the job instead of skipping the suite.
    if: vars.STRIPE_LIVE_ENABLED == 'true'
    # The suite reuses fixed lookup keys in one sandbox; two runs at once could
    # both try to create the same price.
    concurrency:
      group: billing-live-stripe-sandbox
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The webhook-delivery test skips here because the Stripe CLI is not installed.
      - name: Live Stripe suite
        run: bun --filter @context-kit/billing test:live
        env:
          STRIPE_TEST_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
          REQUIRE_STRIPE_LIVE: "1"
