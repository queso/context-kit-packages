name: Release

# Builds an installable tarball for one package and attaches it to a GitHub release.
# Steps for cutting a release are in docs/releasing.md.
#
#   push of a tag <package>-v<version>   build, then create the release for that tag
#   workflow_dispatch, dry_run: true      build the tarball for `tag` and upload it as a
#                                         workflow artifact; no release is created
#   workflow_dispatch, dry_run: false     create the release; must be run on the tag
#                                         itself ("Use workflow from" = the tag)
#   pull_request changing this workflow   dry run for error-tracker at its current
#   or scripts/pack-check.ts              package.json version
#
# workflow_dispatch only works once this file is on the default branch, which is why
# pull requests that change it also run the dry run.

on:
  push:
    tags: ["*-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build, <package>-v<version> (e.g. error-tracker-v0.1.0). It need not exist for a dry run."
        required: true
        type: string
      dry_run:
        description: "Build and upload the tarball as a workflow artifact without creating a release"
        required: true
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/release.yml
      - scripts/pack-check.ts

# The build job runs the repo's code and gets a read-only token. Only the publish job,
# which runs no repo code, gets contents: write.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build tarball
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      file: ${{ steps.pack.outputs.file }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.11"

      - name: Resolve tag and check the package version
        id: tag
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          case "$EVENT" in
            push) tag="$GITHUB_REF_NAME" ;;
            workflow_dispatch) tag="$INPUT_TAG" ;;
            pull_request) tag="error-tracker-v$(jq -r .version packages/error-tracker/package.json)" ;;
          esac

          if [[ ! "$tag" =~ ^([a-z0-9][a-z0-9-]*)-v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?)$ ]]; then
            echo "::error::Tag '$tag' is not of the form <package>-v<major>.<minor>.<patch>"
            exit 1
          fi
          dir="${BASH_REMATCH[1]}"
          version="${BASH_REMATCH[2]}"
          manifest="packages/$dir/package.json"
          if [ ! -f "$manifest" ]; then
            echo "::error::Tag '$tag' names package directory '$dir', but $manifest does not exist"
            exit 1
          fi
          pkg_version="$(jq -r .version "$manifest")"
          if [ "$pkg_version" != "$version" ]; then
            echo "::error::Tag '$tag' is version $version, but $manifest has version $pkg_version"
            exit 1
          fi

          # A real release from workflow_dispatch must build the tagged commit.
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$DRY_RUN" != "true" ] && [ "$GITHUB_REF" != "refs/tags/$tag" ]; then
            echo "::error::A release (dry_run: false) must be run on the tag itself; this run is on $GITHUB_REF"
            exit 1
          fi

          {
            echo "tag=$tag"
            echo "dir=$dir"
            echo "name=$(jq -r .name "$manifest")"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - name: Extract release notes from the changelog
        env:
          DIR: ${{ steps.tag.outputs.dir }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          # The section runs from "## [<version>]" to the next "## " heading or link
          # reference definition.
          awk -v version="$VERSION" '
            index($0, "## [" version "]") == 1 { found = 1; next }
            found && (/^## / || /^\[[^]]+\]: /) { exit }
            found { print }
          ' "packages/$DIR/CHANGELOG.md" | sed -e '/./,$!d' > "$RUNNER_TEMP/release/notes.md"
          if [ ! -s "$RUNNER_TEMP/release/notes.md" ] || ! grep -q '[^[:space:]]' "$RUNNER_TEMP/release/notes.md"; then
            echo "::error::packages/$DIR/CHANGELOG.md has no '## [$VERSION]' section with content"
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The whole repo builds: auth-ui's build resolves @context-kit/auth from packages/auth/dist.
      - name: Build
        run: bun run build

      - name: Typecheck
        env:
          NAME: ${{ steps.tag.outputs.name }}
        run: bun --filter "$NAME" typecheck

      - name: Test
        env:
          NAME: ${{ steps.tag.outputs.name }}
        run: bun --filter "$NAME" test

      # Packs the package and checks the tarball installs into an empty project, every
      # exports entry imports, and the types check under TypeScript 7.
      - name: Pack and check
        id: pack
        env:
          DIR: ${{ steps.tag.outputs.dir }}
          NAME: ${{ steps.tag.outputs.name }}
          VERSION: ${{ steps.tag.outputs.version }}
          PACK_CHECK_OUT: ${{ runner.temp }}/pack
        run: |
          bun scripts/pack-check.ts "$DIR"
          file="$(echo "$NAME" | sed -e 's/^@//' -e 's#/#-#')-$VERSION.tgz"
          cp "$PACK_CHECK_OUT/tarballs/$file" "$RUNNER_TEMP/release/$file"
          echo "file=$file" >> "$GITHUB_OUTPUT"

      - name: Job summary
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          FILE: ${{ steps.pack.outputs.file }}
          PUBLISHES: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run) }}
        run: |
          tarball="$RUNNER_TEMP/release/$FILE"
          hex="$(sha512sum "$tarball" | cut -d' ' -f1)"
          integrity="sha512-$(openssl dgst -sha512 -binary "$tarball" | base64 -w0)"
          {
            echo "## $TAG"
            echo
            if [ "$PUBLISHES" = "true" ]; then
              echo "The publish job attaches this tarball to the release for \`$TAG\`. Install with:"
            else
              echo "**Dry run.** No release is created. The tarball is in the \`release-$TAG\` workflow artifact. After a release for \`$TAG\`, the install line is:"
            fi
            echo
            echo '```bash'
            echo "bun add https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$FILE"
            echo '```'
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| File | \`$FILE\` ($(stat -c %s "$tarball") bytes) |"
            echo "| sha512 | \`$hex\` |"
            echo "| integrity | \`$integrity\` |"
            echo
            echo "### Release notes"
            echo
            cat "$RUNNER_TEMP/release/notes.md"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ steps.tag.outputs.tag }}
          path: |
            ${{ runner.temp }}/release/${{ steps.pack.outputs.file }}
            ${{ runner.temp }}/release/notes.md
          if-no-files-found: error

  publish:
    name: Create release
    needs: build
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ needs.build.outputs.tag }}
          path: release

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.build.outputs.tag }}
          FILE: ${{ needs.build.outputs.file }}
        run: |
          gh release create "$TAG" "release/$FILE" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$TAG" \
            --notes-file release/notes.md
          {
            echo "Released [\`$TAG\`]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG)."
          } >> "$GITHUB_STEP_SUMMARY"
